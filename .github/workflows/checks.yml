name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check skill package
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test workflow and approval gates
        run: node --test tests/test_flow.cjs
      - name: Download pinned secret scanner and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -fLsS --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks/scanner.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks/scanner.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks/scanner.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan files and Git history
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact --no-banner
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner
